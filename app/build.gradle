plugins {
    id 'com.android.application'
}

if (project.hasProperty('phoneQuoteBuildDir')) {
    layout.buildDirectory = file(project.property('phoneQuoteBuildDir'))
}

android {
    namespace 'com.local.phonequote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.phonequote'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.6.1-ocr'

        buildConfigField 'String', 'API_BASE_URL', '"https://localhost/api/v1/"'
        buildConfigField 'boolean', 'USE_DEMO_BACKEND', 'false'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', '"http://10.0.2.2:8000/api/v1/"'
        }
        release {
            def endpoint = providers.gradleProperty('phoneQuoteApiUrl').orElse('').get()
            buildConfigField 'String', 'API_BASE_URL', '"' + endpoint + '"'
            tasks.configureEach { task ->
                if (task.name == 'preReleaseBuild') {
                    task.doFirst {
                        def uri = new URI(endpoint)
                        if (uri.scheme != 'https' || !uri.host || uri.userInfo || !endpoint.endsWith('/api/v1/') || endpoint.contains('"')) {
                            throw new GradleException('Release requires -PphoneQuoteApiUrl=https://YOUR_HOST/api/v1/')
                        }
                    }
                }
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    testImplementation 'junit:junit:4.13.2'
}
